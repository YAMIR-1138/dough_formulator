<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Dough Canvas - the formula as a living, self-annotating jar you sculpt by touch.">
    <title>Ⅱ Dough Canvas - THE LAB</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🥖</text></svg>">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..700;1,9..144,300..700&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="lab.css">
</head>
<body>
    <div class="page canvas-page">
        <nav id="lab-nav"></nav>

        <header class="canvas-header">
            <div>
                <span class="smallcaps">experiment Ⅱ</span>
                <h2>Dough Canvas</h2>
            </div>
            <select id="preset-select" class="no-print" aria-label="Load a preset">
                <option value="">Presets…</option>
            </select>
        </header>

        <svg id="jar" class="jar-svg v3" viewBox="0 0 390 660" aria-label="Dough composition canvas"></svg>

        <p class="caption no-print canvas-hint">
            Everything happens on the glass: drag an edge or a margin label, tap a layer to
            magnify it, twist the salt cellar. The jar tells you the rest.
        </p>
    </div>

    <script type="module" src="canvas.js"></script>
</body>
</html>
